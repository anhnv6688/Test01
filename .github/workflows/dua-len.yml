name: Đưa lên máy chủ

# Dựng MỘT ảnh, đưa ảnh đó lên bản thử, và khi đạt thì đưa ĐÚNG ảnh đó sang bản
# thật. Đây là nguyên tắc số 2 ở docs/moi-truong.md, và nó là lý do phần này tồn
# tại: dựng lại trên máy chủ cho bản thật là một lần biên dịch khác, một cây phụ
# thuộc có thể khác — thứ đưa lên bản thật không còn là thứ vừa thử xong, và
# toàn bộ việc thử mất ý nghĩa.
#
# Cần khai báo trước, theo từng Environment của GitHub (`thu` và `that`):
#
#   Secret   VPS_HOST       địa chỉ máy chủ
#   Secret   VPS_USERNAME   người vận hành (không phải root)
#   Secret   VPS_SSH_KEY    khóa riêng SSH của phần chạy tự động
#   Secret   VPS_HOST_KEY   dòng known_hosts, lấy bằng: ssh-keyscan <máy>
#   Secret   VPS_PORT       cổng SSH — để trống thì dùng 22
#   Variable VPS_URL        địa chỉ công khai, ví dụ https://thu.oly.vn
#
# Tên biến ở đây tiếng Anh, khác quy ước tiếng Việt của kho mã. Đó là có chủ ý:
# bốn cái đầu là tên người vận hành đã tạo sẵn trên GitHub, và đổi tên trong mã
# thì bắt họ tạo lại — vô ích, và vô ích theo hướng dễ gõ sai. `VPS_*` cũng là
# quy ước gần như phổ biến ở các kho khác, nên người mới nhận việc đọc là hiểu.
#
# Khai ở REPOSITORY secrets là đủ cho lúc chỉ có một máy. Nếu về sau có máy
# trong nước cho bản thật thì tạo Environment `that` và khai lại bốn cái đó
# trong environment đó — GitHub cho environment ghi đè secret cùng tên của
# repository, nên đến lúc ấy không phải sửa một dòng mã nào.
#
# Và một việc PHẢI làm bằng tay trên GitHub, không khai trong tệp này được:
# đặt "Required reviewers" cho Environment `that`. Bản thật chạm vào dữ liệu
# thật của các hộ, nên mỗi lần đưa lên phải có người đồng ý.

on:
  push:
    # Nhánh làm việc cũng đưa lên bản thử được, và đó là chủ đích: môi trường
    # thử tồn tại để người nội bộ bấm vào thứ vừa viết xong, nên bắt gộp vào
    # nhánh chính trước là bắt chờ đúng cái vòng mà bản thử sinh ra để cắt.
    #
    # Chỉ `push` mới chạy được từ nhánh khác. `workflow_dispatch` thì GitHub
    # đòi tệp workflow nằm trên nhánh mặc định — nên nút bấm tay, và vì thế cả
    # đường lên bản THẬT, chỉ hiện ra sau khi nhánh này đã gộp vào main. Đó là
    # một hàng rào có ích chứ không phải phiền toái: bản thật thì nên đi qua
    # nhánh chính.
    branches: [main, "claude/**"]
  workflow_dispatch:
    inputs:
      moi_truong:
        description: "Đưa lên môi trường nào"
        type: choice
        options: [thu, that]
        default: thu

# Hai lần triển khai chồng nhau sẽ tranh nhau ghi .env trên máy chủ và để lại
# một máy chủ chạy ảnh này mà .env ghi ảnh kia. Xếp hàng, đừng hủy lần đang
# chạy: hủy giữa chừng còn tệ hơn, vì nó dừng sau khi đã `up -d`.
concurrency:
  group: dua-len-${{ github.event.inputs.moi_truong || 'thu' }}
  cancel-in-progress: false

jobs:
  kiem:
    name: Không đưa lên một bản đang đỏ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Chạy lại toàn bộ ở đây chứ không tin vào lần chạy của workflow kiểm tra.
      # Hai workflow chạy song song, nên "lần kia chắc xanh rồi" là một giả định
      # về thời gian, và giả định về thời gian thì sai vào đúng hôm quan trọng.
      - run: npm run kiem-tra
      - run: npm run khong-ro-ri

  dung-anh:
    name: Dựng ảnh một lần
    needs: kiem
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      anh: ${{ steps.ten.outputs.anh }}
    steps:
      - uses: actions/checkout@v5

      - name: Tên ảnh
        id: ten
        # Sổ đăng ký của GitHub chỉ nhận chữ thường, mà tên kho thì có chữ hoa.
        # Gắn nhãn bằng mã băm lần gửi mã, không dùng "latest": phải nói được
        # máy chủ đang chạy đúng lần gửi mã nào.
        run: |
          KHO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "anh=ghcr.io/$KHO:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ten.outputs.anh }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dua-len:
    name: Đưa lên ${{ github.event.inputs.moi_truong || 'thu' }}
    needs: dung-anh
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: ${{ github.event.inputs.moi_truong || 'thu' }}
    # Chuyển địa chỉ công khai sang việc soi dưới dạng kết quả đầu ra.
    #
    # Việc soi có thể tự đọc `vars.VPS_URL`, nhưng muốn đọc được thì nó
    # phải khai `environment:` — và khai thì nó lại chạm vào luật "phải có
    # người duyệt" của bản thật, tức là mỗi lần đưa lên bản thật phải bấm duyệt
    # hai lần. Lần thứ hai nằm SAU khi đã triển khai, nên không duyệt thì bản
    # thật vẫn chạy mà không ai soi. Một cửa duyệt đặt sai chỗ thì tệ hơn là
    # không có: nó tạo cảm giác đã kiểm soát.
    outputs:
      dia_chi: ${{ vars.VPS_URL }}
    env:
      MOI_TRUONG: ${{ github.event.inputs.moi_truong || 'thu' }}
      ANH: ${{ needs.dung-anh.outputs.anh }}
      # Cổng SSH. Để trống thì 22 — nhưng đổi cổng là một việc nên làm: cổng 22
      # công khai hứng hàng nghìn lượt dò mật khẩu mỗi ngày. Nó KHÔNG phải là
      # bảo mật (ai quét cũng tìm ra), chỉ là bớt rác trong nhật ký và bớt việc
      # cho fail2ban.
      CONG: ${{ secrets.VPS_PORT || '22' }}
    steps:
      - uses: actions/checkout@v5

      - name: Bản thật chỉ đưa lên từ nhánh chính
        # Một nhánh bất kỳ đẩy được lên bản thật nghĩa là mã chưa qua xét duyệt
        # cũng chạm được vào dữ liệu thật của các hộ.
        if: env.MOI_TRUONG == 'that' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::Bản thật chỉ đưa lên được từ nhánh ${{ github.event.repository.default_branch }}."
          exit 1

      - name: Chuẩn bị SSH
        env:
          KHOA: ${{ secrets.VPS_SSH_KEY }}
          KHOA_MAY: ${{ secrets.VPS_HOST_KEY }}
          MAY: ${{ secrets.VPS_HOST }}
        run: |
          # Gọi tên từng khai báo còn thiếu, không báo gộp "thiếu khai báo".
          #
          # Người vận hành đọc dòng này lúc đang dở việc và thường là lần đầu
          # dựng máy; báo gộp thì họ phải mở tài liệu, đối chiếu năm thứ, rồi
          # thử lại — mà mỗi lần thử là một vòng CI ba phút. Chỉ in TÊN, tuyệt
          # đối không in giá trị: nhật ký Actions ai có quyền đọc kho cũng xem
          # được, và một khóa riêng SSH lọt vào đó là phải tạo lại khóa.
          THIEU=""
          [ -n "${{ secrets.VPS_HOST }}" ]     || THIEU="$THIEU VPS_HOST"
          [ -n "${{ secrets.VPS_USERNAME }}" ] || THIEU="$THIEU VPS_USERNAME"
          [ -n "$KHOA" ]                       || THIEU="$THIEU VPS_SSH_KEY"
          [ -n "$KHOA_MAY" ]                   || THIEU="$THIEU VPS_HOST_KEY"
          if [ -n "$THIEU" ]; then
            echo "::error::Còn thiếu secret:$THIEU"
            echo "::error::Khai ở Settings > Secrets and variables > Actions."
            echo "::error::Lấy VPS_HOST_KEY bằng: ssh-keyscan -p <cổng> <địa-chỉ-máy>"
            echo "::error::Chi tiết: docs/vps-contabo.md"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KHOA" > ~/.ssh/id_trien_khai
          chmod 600 ~/.ssh/id_trien_khai

          #
          # Ghim khóa máy chủ, nhưng ghim đúng thứ đáng ghim.
          #
          # TUYỆT ĐỐI không dùng StrictHostKeyChecking=no: nó chấp nhận bất cứ
          # máy nào trả lời ở địa chỉ đó, nên một lần chiếm quyền DNS là đủ để
          # nhận trọn khóa triển khai và toàn bộ nội dung gửi lên.
          #
          # Nhưng dán thẳng kết quả ssh-keyscan vào known_hosts thì ghim CẢ
          # chuỗi tên máy người vận hành đã gõ lúc quét. Quét bằng tên miền rồi
          # kết nối bằng IP — hoặc quét quên -p rồi đổi cổng — đều làm ssh từ
          # chối, và nó từ chối bằng đúng câu "Host key verification failed",
          # câu mà người đọc sẽ hiểu là đang bị tấn công. Một cảnh báo an ninh
          # kêu vì lý do hành chính là cảnh báo sẽ bị tắt.
          #
          # An toàn nằm ở BYTES CỦA KHÓA, không nằm ở chuỗi tên máy. Nên ở đây
          # ta lấy phần khóa ra khỏi secret rồi TỰ ghi lại cột tên máy cho đúng
          # địa chỉ và cổng sắp kết nối tới. Việc ghim không yếu đi một chút
          # nào: máy lạ vẫn bị từ chối vì khóa khác, chỉ khác là nó không còn từ
          # chối vì một lý do không liên quan tới an ninh.
          #
          # Cổng 22 thì ssh tra known_hosts bằng tên trần; cổng khác thì bằng
          # dạng [máy]:cổng. Phải ghi đúng dạng tương ứng.
          if [ "$CONG" = "22" ]; then TEN="$MAY"; else TEN="[$MAY]:$CONG"; fi
          : > ~/.ssh/known_hosts
          SO_KHOA=0
          SO_DONG=0
          HINH_DANG=""

          #
          # Nhận CẢ HAI dạng người ta hay dán, thay vì chỉ một dạng.
          #
          # Bản đầu chỉ nhận dạng ssh-keyscan (`<máy> <loại> <khóa>`) rồi hỏng
          # với thông báo "không có dòng khóa nào đọc được" — đúng nhưng vô ích,
          # vì nó không nói dán sai thành cái gì.
          #
          # Hai dạng trông rất giống nhau và đều hợp lý với người dán:
          #   ssh-keyscan  ->  109.123.233.46 ssh-ed25519 AAAA...
          #   tệp .pub     ->  ssh-ed25519 AAAA... ghi-chu
          # Khác nhau ở chỗ loại khóa nằm ở cột 1 hay cột 2. Cả hai đều mang
          # ĐÚNG những bytes cần ghim, nên từ chối một dạng chỉ là khó tính vô
          # cớ. Nhận cả hai, và việc ghim không yếu đi chút nào.
          #
          while read -r c1 c2 c3 _rest; do
            [ -n "$c1" ] || continue
            SO_DONG=$((SO_DONG + 1))
            case "$c1" in
              ssh-ed25519|ssh-rsa|ecdsa-sha2-*) LOAI="$c1"; KHOA_BYTES="$c2" ;;
              *)
                case "$c2" in
                  ssh-ed25519|ssh-rsa|ecdsa-sha2-*) LOAI="$c2"; KHOA_BYTES="$c3" ;;
                  *) HINH_DANG="$HINH_DANG  dòng $SO_DONG: không thấy loại khóa ở cột 1 hay cột 2$(printf '\n')"; continue ;;
                esac
                ;;
            esac
            [ -n "$KHOA_BYTES" ] || {
              HINH_DANG="$HINH_DANG  dòng $SO_DONG: có loại $LOAI nhưng thiếu phần khóa$(printf '\n')"
              continue
            }
            printf '%s %s %s\n' "$TEN" "$LOAI" "$KHOA_BYTES" >> ~/.ssh/known_hosts
            SO_KHOA=$((SO_KHOA + 1))
          done <<< "$(printf '%s\n' "$KHOA_MAY" | tr -d '\r' | grep -v '^[[:space:]]*#' || true)"
          chmod 600 ~/.ssh/known_hosts

          # Kiểm bằng chính ssh-keygen, không tin vào việc mình vừa ghi đúng:
          # một khóa base64 bị cắt giữa vẫn trông như một dòng hợp lệ.
          if [ "$SO_KHOA" -gt 0 ] && ! ssh-keygen -lf ~/.ssh/known_hosts >/dev/null 2>&1; then
            echo "::error::Đã tách được $SO_KHOA dòng nhưng ssh-keygen không đọc nổi."
            echo "::error::Phần khóa base64 nhiều khả năng bị cắt giữa lúc dán."
            SO_KHOA=0
          fi

          if [ "$SO_KHOA" -eq 0 ]; then
            echo "::error::Không tách được khóa nào từ VPS_HOST_KEY (đọc được $SO_DONG dòng)."
            [ -n "$HINH_DANG" ] && printf '%s' "$HINH_DANG"
            echo "::error::Lấy lại bằng đúng lệnh này, rồi dán NGUYÊN VĂN cả khối:"
            echo "::error::    ssh-keyscan -p $CONG <địa-chỉ-máy>"
            echo "::error::Mỗi dòng phải có ba phần, ví dụ:  <máy> ssh-ed25519 AAAAC3Nza..."
            echo "::error::Dán dấu vân tay (SHA256:...) thì KHÔNG dùng được — vân tay không phải khóa."
            exit 1
          fi
          echo "Đã ghim $SO_KHOA khóa máy chủ."

      - name: Nhắc nếu chưa khai địa chỉ công khai
        # Thiếu biến này thì việc soi bị BỎ QUA, và bỏ qua thì không ai biết —
        # một lần triển khai xanh mà chưa ai thử mã mặc định vào nó.
        if: vars.VPS_URL == ''
        run: |
          echo "::warning::Chưa khai variable VPS_URL."
          echo "::warning::Thiếu nó thì việc soi bản đã triển khai bị bỏ qua — sẽ KHÔNG ai thử PIN 1234 và mã trực mặc định vào máy chủ này."

      - name: Gửi tệp cấu hình lên máy chủ
        # Gửi cấu hình thay vì để máy chủ tự `git pull`. Nhờ vậy máy chủ không
        # cần bất kỳ thông tin đăng nhập GitHub nào, và thứ đang chạy trên đó
        # luôn khớp đúng lần gửi mã vừa dựng ra ảnh.
        env:
          MAY: ${{ secrets.VPS_HOST }}
          NGUOI: ${{ secrets.VPS_USERNAME }}
        run: |
          tar czf - compose.yaml compose.thu.yaml compose.that.yaml trien-khai \
            | ssh -p "$CONG" -i ~/.ssh/id_trien_khai "$NGUOI@$MAY" \
                'mkdir -p ~/o-ly && tar xzf - -C ~/o-ly'

      - name: Chẩn đoán khi không kết nối được
        #
        # Chạy CHỈ KHI có bước trước đó hỏng. "Host key verification failed" là
        # một câu không nói gì cả: nó đúng khi bị tấn công, và cũng đúng khi
        # người ta dán nhầm khóa của một máy khác. Không phân biệt được hai
        # trường hợp đó thì người vận hành hoặc hoảng, hoặc tệ hơn là quen dần
        # rồi thêm StrictHostKeyChecking=no cho xong.
        #
        # In DẤU VÂN TAY, không in khóa và không in địa chỉ. Vân tay sinh ra để
        # công bố — chính nó là thứ nhà cung cấp máy chủ in ở bảng điều khiển —
        # nên đối chiếu được mà không lộ gì.
        if: failure()
        env:
          MAY: ${{ secrets.VPS_HOST }}
        run: |
          echo "Khóa ĐANG GHIM (từ secret VPS_HOST_KEY):"
          # Lấy kết quả ra biến trước rồi mới kiểm. Viết
          # `ssh-keygen ... | awk ... || echo` thì mã thoát của cả đường ống là
          # mã của awk, luôn bằng 0 — nên nhánh `||` không bao giờ chạy và
          # người đọc thấy một mục TRỐNG mà không biết là trống vì sao.
          GHIM=$(ssh-keygen -lf ~/.ssh/known_hosts 2>/dev/null | awk '{print "  " $1 " " $2 " " $NF}')
          if [ -n "$GHIM" ]; then printf '%s\n' "$GHIM"; else echo "  (chưa ghim được khóa nào — xem lỗi ở bước Chuẩn bị SSH)"; fi

          echo "Khóa máy chủ ĐANG TRẢ VỀ ngay bây giờ:"
          if ssh-keyscan -T 10 -p "$CONG" "$MAY" > /tmp/khoa-hien-tai 2>/dev/null && [ -s /tmp/khoa-hien-tai ]; then
            ssh-keygen -lf /tmp/khoa-hien-tai | awk '{print "  " $1 " " $2 " " $NF}'
            echo ""
            echo "Hai danh sách trên KHÁC nhau  -> VPS_HOST_KEY là của máy khác, hoặc máy đã cài lại."
            echo "Hai danh sách GIỐNG nhau      -> khóa đúng; lỗi nằm ở chỗ khác:"
            echo "  * VPS_SSH_KEY chưa nằm trong ~/.ssh/authorized_keys của VPS_USERNAME"
            echo "  * hoặc VPS_USERNAME sai"
            echo "  * hoặc khóa riêng dán thiếu dòng BEGIN/END"
          else
            echo "  (không nối được tới cổng $CONG)"
            echo ""
            echo "Không chạm được tới máy. Ba khả năng, theo thứ tự hay gặp:"
            echo "  * VPS_PORT sai — máy đang nghe ở cổng khác"
            echo "  * tường lửa chặn: trên máy chủ chạy  sudo ufw allow $CONG/tcp"
            echo "  * VPS_HOST sai"
          fi

      - name: Chạy ảnh mới
        env:
          MAY: ${{ secrets.VPS_HOST }}
          NGUOI: ${{ secrets.VPS_USERNAME }}
          THE: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Đăng nhập sổ đăng ký bằng thẻ của chính lần chạy này. Thẻ đó hết
          # hạn khi việc kết thúc, nên máy chủ không giữ lại một thông tin đăng
          # nhập sống mãi. Đăng xuất ngay sau đó, kể cả khi triển khai hỏng.
          printf '%s' "$THE" | ssh -p "$CONG" -i ~/.ssh/id_trien_khai "$NGUOI@$MAY" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          MA=0
          ssh -p "$CONG" -i ~/.ssh/id_trien_khai "$NGUOI@$MAY" \
            "cd ~/o-ly && bash trien-khai/chay-anh.sh '$ANH' '$MOI_TRUONG'" || MA=$?
          ssh -p "$CONG" -i ~/.ssh/id_trien_khai "$NGUOI@$MAY" "docker logout ghcr.io" || true
          exit $MA

      - name: Xóa khóa khỏi máy chạy việc
        if: always()
        run: rm -f ~/.ssh/id_trien_khai

  soi:
    name: Soi bản đã triển khai
    needs: [dung-anh, dua-len]
    runs-on: ubuntu-latest
    # Cần địa chỉ công khai có chứng chỉ thật. Máy chỉ có địa chỉ IP thì chứng
    # chỉ là bản tự ký, trình duyệt và curl đều từ chối — đó là một lý do nữa
    # để lấy tên miền, chứ không phải lý do để tắt kiểm chứng chỉ.
    if: needs.dua-len.outputs.dia_chi != ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Bộ này tự thử PIN 1234 và mã trực truc2026 vào chính máy chủ vừa triển
      # khai rồi ĐÒI BỊ TỪ CHỐI. Hơn bốn trăm bài kiểm thử trong Node không làm
      # được việc đó: chúng không biết máy ngoài kia khởi động với biến môi
      # trường nào. Đây là chỗ duy nhất phát hiện một máy chủ chạy đúng mã nguồn
      # nhưng sai cấu hình.
      - name: Máy chủ từ chối mọi mã mặc định
        run: npm run kiem-moi-truong -- --goc "${{ needs.dua-len.outputs.dia_chi }}" --cho "${{ github.event.inputs.moi_truong || 'thu' }}"

      # Chỉ soi giao diện ở bản thử, và không phải vì bản thật ít quan trọng
      # hơn. Bộ kiểm giao diện bấm vào một bạn rồi đo bề rộng hình minh họa, mà
      # bản thật CỐ TÌNH không có hộ mẫu — hộ mẫu là một tài khoản không chủ.
      # Chạy ở đó thì nó đỏ vì không có gì để bấm, và một bộ kiểm đỏ oan sẽ bị
      # người ta tắt đi, rồi mất luôn cả những lần đỏ thật.
      #
      # Cùng một ảnh đã qua bộ kiểm này ở bản thử trước khi sang bản thật, nên
      # phần giao diện đã được soi — chỉ là soi ở chỗ có dữ liệu để soi.
      - name: Giao diện nhìn thấy được trên bản đã triển khai
        if: (github.event.inputs.moi_truong || 'thu') == 'thu'
        run: npm run kiem-giao-dien -- --goc "${{ needs.dua-len.outputs.dia_chi }}"
        env:
          OLY_CHROME: ""
